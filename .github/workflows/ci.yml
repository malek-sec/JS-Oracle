name: CI

# Run lint and the test suite on every push and PR to main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev tooling
        # Installs runtime deps + pytest/ruff. The Playwright browser extra is
        # intentionally omitted: the renderer soft-imports Playwright, so the
        # tests run without a browser.
        run: |
          python -m pip install --upgrade pip
          pip install '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -q
