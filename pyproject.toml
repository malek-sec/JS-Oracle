[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "js-oracle"
version = "0.1.0"
description = "AI-powered JavaScript analysis for bug bounty hunters — extracts endpoints, secrets, auth logic, and suspicious patterns from JS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "malek-sec" }]
keywords = ["bug-bounty", "javascript", "security", "static-analysis", "recon", "llm"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

dependencies = [
    "anthropic>=0.96,<1.0",
    "jsbeautifier>=1.15.1",
    "rich>=13.7.0",
    "click>=8.1.7",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Gemini backend (AI_PROVIDER=gemini). Not needed for the default Claude provider.
gemini = ["google-genai>=2.19,<3.0"]
# Headless-browser rendering for SPA targets (the `hunt --render` option).
browser = ["playwright>=1.40"]
# Test/lint tooling.
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
js-oracle = "main:cli"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "output*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pyflakes (real bugs: unused imports, undefined names) + pycodestyle.
select = ["E", "F", "W"]
ignore = ["E501"]  # long lines are intentional (banner, help text, schema literals)

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before the core imports, so they can't be at the very top.
"main.py" = ["E402"]
